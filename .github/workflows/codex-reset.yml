name: Codex Reset firmware

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: reset-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    container:
      image: espressif/idf:v5.5.3
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - name: Install host validation prerequisites
        run: |
          apt-get update
          apt-get install --yes --no-install-recommends build-essential curl git ca-certificates
      - name: Align checkout ownership with the container user
        run: chown -R "$(id -u):$(id -g)" "$GITHUB_WORKSPACE"
      - name: Full static, host, firmware and merged-image gate
        run: |
          source /opt/esp/idf/export.sh
          python3 tools/apply_blufi_safety_patch.py --apply
          ./tools/validate.sh
          python3 tools/package_ci_firmware.py
          git diff --exit-code -- dependencies.lock
      - name: Upload verified firmware and identity
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: codex-reset-v2.2-${{ github.sha }}
          path: build/ci-artifact/
          if-no-files-found: error
          retention-days: 14
